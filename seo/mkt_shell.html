<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Звіт: маркетинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* лише екран пароля і шапка; решта стилів приходить у зашифрованому пакеті */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#f6f7f5;font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#lock form{background:#fff;border:1px solid #e3e7e2;border-radius:14px;padding:26px 24px;width:100%;max-width:340px}
#lock h2{font-size:16px;margin:0 0 4px}
#lock p{font-size:11px;color:#7b857f;margin:0 0 14px}
#lock input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 10px;border:1px solid #e3e7e2;border-radius:8px}
#lock button{width:100%;margin-top:10px;font:inherit;font-size:13px;font-weight:700;padding:9px;border:0;border-radius:8px;background:#2A9D8F;color:#fff;cursor:pointer}
#lock .err{color:#C0392B;font-size:11px;min-height:16px;margin-top:6px}
#lock label{display:flex;gap:6px;align-items:center;font-size:11px;margin-top:10px;color:#3a443e}
#app{display:none}
.rpt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #e6e9e3;position:sticky;top:0;z-index:50}
.rpt-top h1{font-size:15px;margin:0;font-weight:800}
.rpt-top .s{font-size:10.5px;color:#7b857f}
.rpt-top a{font-size:11px;color:#7b857f}
</style>
</head>
<body>
<div id="lock">
  <form id="lf" autocomplete="off">
    <h2>Звіт: маркетинг</h2>
    <p>Введіть пароль, щоб відкрити звіт.</p>
    <input type="password" id="pw" placeholder="Пароль" autofocus>
    <label><input type="checkbox" id="rem"> запам'ятати на цьому пристрої</label>
    <button type="submit" id="go">Відкрити</button>
    <div class="err" id="perr"></div>
  </form>
</div>
<div id="app">
  <div class="rpt-top"><div><h1>Маркетинг</h1><div class="s" id="rpt-gen"></div></div><a href="#" id="lo">вийти</a></div>
  <div id="rpt-root"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>
const ENC = /*__PAYLOAD__*/null;
const LS = 'rpt_k2';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.s), iterations: ENC.n, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.i) }, key, b64(ENC.c));
  const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}

// v7.31: назви сайтів показуються як є; тут лишаються лише заміни, якщо колись знадобляться
const RENAME = [];
function scrub(root) {
  const fix = s => RENAME.reduce((t, [rx, to]) => t.replace(rx, to), s);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while ((n = w.nextNode())) { const v = fix(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  if (root.querySelectorAll) root.querySelectorAll('[title]').forEach(e => { const v = fix(e.title); if (v !== e.title) e.title = v; });
}

function start(P) {
  document.head.insertAdjacentHTML('beforeend', '<style>' + P.css + '</style>');
  $('rpt-gen').textContent = 'Дані станом на ' + new Date(P.generated).toLocaleString('uk-UA', { timeZone: 'Europe/Kyiv', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  // дані віддаються з розшифрованого пакета замість мережі
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opt) => {
    const u = String(url).split('?')[0];
    if (/^(\.\/)?data\//.test(u)) {
      const k = u.replace(/^\.\//, '');
      return Promise.resolve(P.files[k] != null
        ? new Response(JSON.stringify(P.files[k]), { status: 200, headers: { 'Content-Type': 'application/json' } })
        : new Response('{}', { status: 404 }));
    }
    return realFetch(url, opt);
  };
  const root = $('rpt-root');
  root.innerHTML = P.html;
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(x => { if (x.nodeType === 1) scrub(x); else if (x.nodeType === 3) scrub(x.parentNode || root); })))
    .observe(root, { childList: true, subtree: true, characterData: false });
  P.js.forEach(code => { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); });
}

async function unlock(pw, remember) {
  const err = $('perr'); err.textContent = ''; $('go').disabled = true; $('go').textContent = 'Відкриваю…';
  try {
    const data = await decrypt(pw);
    if (remember) { try { localStorage.setItem(LS, pw); } catch (e) {} }
    $('lock').style.display = 'none'; $('app').style.display = 'block';
    start(data);
  } catch (e) {
    console.warn(e);
    try { localStorage.removeItem(LS); } catch (x) {}
    err.textContent = !window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined'
      ? 'Браузер застарів — відкрийте звіт в актуальному Chrome / Safari / Firefox.' : 'Невірний пароль.';
  }
  $('go').disabled = false; $('go').textContent = 'Відкрити';
}
$('lf').onsubmit = e => { e.preventDefault(); unlock($('pw').value, $('rem').checked); };
$('lo').onclick = e => { e.preventDefault(); try { localStorage.removeItem(LS); } catch (x) {} location.reload(); };
(() => { let s = null; try { s = localStorage.getItem(LS); } catch (e) {} if (s) unlock(s, true); })();
</script>
</body>
</html>
