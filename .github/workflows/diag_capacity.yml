name: Diag Capacity Locations

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Які локації віддає API
        env:
          CAPACITY_API_KEY: ${{ secrets.CAPACITY_API_KEY }}
        run: python diag_capacity.py
