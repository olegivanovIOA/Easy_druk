name: Diag Bitrix Pipelines

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      # v6.2: заповненість індустрій / товарних позицій / глибина історії (лише кількості, без персональних даних)
      - name: Поля Bitrix24 — індустрії, товари, історія
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python diag_bitrix_fields.py
