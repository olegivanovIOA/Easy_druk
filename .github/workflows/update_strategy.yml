name: Update Strategy Data

on:
  schedule:
    - cron: '0 * * * *'   # кожну годину
  workflow_dispatch:       # ручний запуск

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main_root

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and parse Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_API_KEY:  ${{ secrets.GOOGLE_API_KEY }}
        run: python fetch_strategy.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strategy.json data/strategy_progress_history.json
          git diff --cached --quiet || git commit -m "chore: update strategy data [skip ci]"
          git push origin main_root
