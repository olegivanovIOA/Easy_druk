name: Update Strategy Data

on:
  schedule:
    - cron: '0 * * * *'   # кожну годину, о :00
  workflow_dispatch:       # можна запустити вручну з GitHub UI

permissions:
  contents: write          # потрібно для git push

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and parse Google Sheets
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python fetch_strategy.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strategy.json fetch_strategy.py
          # Комітимо тільки якщо файл змінився
          git diff --cached --quiet || git commit -m "chore: update strategy data [skip ci]"
          git push
