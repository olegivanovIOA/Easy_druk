name: Update Dashboard Data

on:
  schedule:
    - cron: '0 * * * *'   # щогодини (стратегія + MQL)
    - cron: '30 5 * * *'  # щодня о 05:30 UTC (HR — після того як Ads-скрипт відпрацює о 07:00 Kyiv)
  workflow_dispatch:

jobs:
  update-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch strategy data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python fetch_strategy.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-strategy files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/strategy.json data/strategy_progress_history.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-strategy data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-strategy
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-hr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch HR data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HR_SHEET_ID: ${{ secrets.HR_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python fetch_hr.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-hr files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/hr.json data/hr_vacancies_history.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-hr data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-hr
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch Ads data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADS_SHEET_ID: ${{ secrets.ADS_SHEET_ID }}
        run: python fetch_ads.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-ads files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/ads.json data/ads_campaigns_daily.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-ads data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-ads
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests google-auth

      - name: Fetch Google Analytics 4 data
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python fetch_ga4.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-ga4 files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/ga4.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-ga4 data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-ga4
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # v7.0: витрати Facebook / Instagram. Без секретів — пропуск, job зелений.
      - name: Fetch Meta (Facebook / Instagram) ads spend
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
        run: python fetch_meta.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-meta files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/meta_ads.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-meta data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-meta
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-shopfloor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      # v6.4: GitHub запускає cron нерегулярно (раз на 2–5 год), тож замість «рівно о годині N»
      # перевіряємо вік даних: оновлюємо, якщо даним ≥ 2.8 год.
      - name: Run if data older than ~3 h (or manually)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, datetime as dt
          now = dt.datetime.utcnow()
          try:
              f = json.load(open("data/shopfloor.json", encoding="utf-8"))["fetched_at"]
              age = (now - dt.datetime.strptime(f[:19], "%Y-%m-%dT%H:%M:%S")).total_seconds() / 3600
          except Exception:
              age = 999
          go = age >= 2.8
          print("go=1" if go else "go=0")
          import sys; print(f"age {age:.1f} h, hour {now.hour} -> {'run' if go else 'skip'}", file=sys.stderr)
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: '3.11'

      - run: pip install requests
        if: steps.gate.outputs.go == '1'

      - name: Fetch shop-floor data (defects journal + shifts)
        if: steps.gate.outputs.go == '1'
        env:
          CAPACITY_API_KEY: ${{ secrets.CAPACITY_API_KEY }}
        run: python fetch_shopfloor.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-shopfloor files
        if: steps.gate.outputs.go == '1'
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/shopfloor.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-shopfloor data
        if: steps.gate.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: data-update-shopfloor
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      # v6.4: GitHub запускає cron нерегулярно (раз на 2–5 год), тож замість «рівно о годині N»
      # перевіряємо вік даних: раз на добу — перший запуск після 00 UTC (03:00 Kyiv), якщо даним ≥ 18 год.
      - name: Run once a day at night (or manually)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, datetime as dt
          now = dt.datetime.utcnow()
          try:
              f = json.load(open("data/clients.json", encoding="utf-8"))["fetched_at"]
              age = (now - dt.datetime.strptime(f[:19], "%Y-%m-%dT%H:%M:%S")).total_seconds() / 3600
          except Exception:
              age = 999
          go = age >= 18 and now.hour < 12 or age >= 30
          print("go=1" if go else "go=0")
          import sys; print(f"age {age:.1f} h, hour {now.hour} -> {'run' if go else 'skip'}", file=sys.stderr)
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: '3.11'

      - run: pip install requests
        if: steps.gate.outputs.go == '1'

      # v6.4: кеш «першого дотику» — щоб не качати всі угоди щоразу (повне завантаження раз на 7 днів)
      - name: Restore first-touch cache
        if: steps.gate.outputs.go == '1'
        uses: actions/cache/restore@v4
        with:
          path: .cache/touch.json
          key: clients-touch-${{ github.run_id }}
          restore-keys: clients-touch-

      - name: Client analytics (LTV / RFM / churn / industries)
        if: steps.gate.outputs.go == '1'
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python fetch_clients.py

      - name: Save first-touch cache
        if: steps.gate.outputs.go == '1' && hashFiles('.cache/touch.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/touch.json
          key: clients-touch-${{ github.run_id }}

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-clients files
        if: steps.gate.outputs.go == '1'
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/clients.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-clients data
        if: steps.gate.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: data-update-clients
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-mql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch MQL/SQL data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MQL_SHEET_ID: ${{ secrets.MQL_SHEET_ID }}
        run: python fetch_mql.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-mql files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/mql_sql.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-mql data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-mql
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-sales:
    # v4.7 (24.09.2026): ВИМКНЕНО. Google-таблиця планувальника більше не джерело —
    # планування продажів підключається через API (як локації/партії), ~2 тижні.
    # Щоб не падала щогодини червоним — job пропускається. Прибрати `if: false`, коли з'явиться API.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: pip install cryptography

      - name: Fetch Sales data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SALES_SHEET_ID: ${{ secrets.SALES_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python fetch_sales.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-sales files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/sales_planner.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-sales data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-sales
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch Capacity data (Локації)
        env:
          CAPACITY_API_KEY: ${{ secrets.CAPACITY_API_KEY }}
        run: python fetch_capacity.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-capacity files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/capacity.json data/capacity_history.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-capacity data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-capacity
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-batches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch Batches/Lots data (Партії)
        env:
          CAPACITY_API_KEY: ${{ secrets.CAPACITY_API_KEY }}
        run: python fetch_batches.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-batches files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/batches_lots.json data/batches_history.json data/batches_monthly_history.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-batches data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-batches
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch CRM deals (Bitrix24, поточний місяць)
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python fetch_crm_deals.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-crm files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/crm_deals.json data/crm_monthly_history.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-crm data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-crm
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  update-cf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Fetch CashFlow data
        env:
          CF_SHEET_ID:                 ${{ secrets.CF_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python fetch_cashflow.py

      # v7.3: дані не комітимо тут — віддаємо job «commit-all», який робить ОДИН коміт на весь запуск
      # (раніше ~12 комітів/год → ~12 збірок GitHub Pages і черга)
      - name: Collect changed update-cf files
        run: |
          mkdir -p _out
          # лише файли, які цей job реально змінив — щоб не затерти свіжіші дані старою копією з checkout
          git status --porcelain -- data/cashflow.json | awk '{print $2}' | while read f; do [ -f "$f" ] && cp "$f" _out/; done
          ls -la _out

      - name: Upload update-cf data
        uses: actions/upload-artifact@v4
        with:
          name: data-update-cf
          path: _out/
          if-no-files-found: ignore
          retention-days: 1

  commit-all:
    # v7.3: один коміт з даними всіх job'ів → одна збірка GitHub Pages на запуск
    needs: [update-strategy, update-hr, update-ads, update-ga4, update-meta, update-shopfloor, update-clients, update-mql, update-sales, update-capacity, update-batches, update-crm, update-cf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - name: Download data from jobs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: data-*
          path: _art
          merge-multiple: true

      - name: Commit all data (one commit)
        run: |
          [ -d _art ] && [ -n "$(ls -A _art)" ] || { echo "Немає нових даних"; exit 0; }
          ls -la _art
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5 6; do
            # щоразу на свіжу верхівку гілки: файли цього запуску кладемо поверх (без конфліктів rebase)
            git fetch -q origin main_root && git reset -q --hard origin/main_root
            cp -f _art/* data/
            git add data
            if git diff --cached --quiet; then echo "No changes"; ok=1; break; fi
            git commit -q -m "chore: update dashboard data ($(git diff --cached --name-only | sed 's#data/##' | tr '\n' ' ')) [skip ci]"
            git push && ok=1 && break
            sleep $((i*4))
          done
          [ "$ok" = 1 ] || { echo "::error::Push data failed after 6 attempts"; exit 1; }
