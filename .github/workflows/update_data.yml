name: Update Dashboard Data

on:
  schedule:
    - cron: '0 * * * *'   # щогодини (стратегія)
    - cron: '30 5 * * *'  # щодня о 05:30 UTC (HR — після того як Ads-скрипт відпрацює о 07:00 Kyiv)
  workflow_dispatch:

jobs:
  update-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch strategy data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python fetch_strategy.py

      - name: Commit strategy.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strategy.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update strategy data [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main_root && git push && break || sleep $((i*3))
          done

  update-hr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch HR data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HR_SHEET_ID: ${{ secrets.HR_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python fetch_hr.py

      - name: Commit HR data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hr.json
          git add data/hr_vacancies_history.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update HR data [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main_root && git push && break || sleep $((i*3))
          done
  update-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch Ads data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADS_SHEET_ID: ${{ secrets.ADS_SHEET_ID }}
        run: python fetch_ads.py

      - name: Commit Ads data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ads.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update ads data [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main_root && git push && break || sleep $((i*3))
          done

  update-cf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Fetch CashFlow data
        env:
          CF_SHEET_ID:                 ${{ secrets.CF_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python fetch_cashflow.py

      - name: Commit CF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cashflow.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update cashflow data [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main_root && git push && break || sleep $((i*3))
          done
