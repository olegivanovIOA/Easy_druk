name: Backfill Batches Monthly History

on:
  workflow_dispatch:

jobs:
  backfill-batches-monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main_root

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Backfill batches monthly history (2026)
        env:
          CAPACITY_API_KEY: ${{ secrets.CAPACITY_API_KEY }}
        run: python backfill_batches_monthly.py

      - name: Commit batches monthly history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/batches_monthly_history.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: backfill batches monthly history 2026"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main_root && git push && break || sleep $((i*3))
          done
